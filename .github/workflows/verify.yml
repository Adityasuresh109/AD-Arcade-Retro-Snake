name: Verify Serpent Shift
on:
  push:
    branches: [main, feature/retro-snake-reborn]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Check HTML assets
        run: |
          test -s reborn/index.html
          test -s reborn/manifest.webmanifest
          test -s reborn/icon.svg
